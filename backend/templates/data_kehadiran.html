<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Data Kehadiran — Sistem Absensi</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=DM+Sans:wght@300;400;500;600&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/base.css') }}"
    />
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/data_kehadiran.css') }}"
    />
  </head>
  <body>
    <nav>
      <span class="brand">[ PRESENSI MULTI WAJAH ]</span>
      <a href="/kehadiran" class="active">Data Kehadiran</a>
    </nav>

    <main>
      <div class="page-title">DATA KEHADIRAN</div>

      <!-- Toolbar -->
      <div class="toolbar">
        <div class="search-wrap">
          <svg
            width="14"
            height="14"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
          >
            <circle cx="11" cy="11" r="8" />
            <path d="m21 21-4.35-4.35" />
          </svg>
          <input
            type="text"
            id="search"
            placeholder="Cari NIM atau Nama..."
            oninput="onSearch()"
          />
        </div>
        <div class="date-filter">
          <label>Tanggal:</label>
          <input type="date" id="filter-date" onchange="onDateChange()" />
        </div>
        <span class="badge" id="total-badge">0 data</span>
      </div>

      <!-- Tabel -->
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>NIM</th>
              <th>Nama Mahasiswa</th>
              <th>Waktu Absen</th>
              <th>Status</th>
            </tr>
          </thead>
          <tbody id="tbody"></tbody>
        </table>
      </div>
    </main>

    <script src="{{ url_for('static', filename='js/data_kehadiran.js') }}"></script>
  </body>
</html>
